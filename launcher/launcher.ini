# TalesUntold launcher settings. Put TalesUntoldLauncher.exe, this file and launcher-bg.jpg into the client root (next to the system folder).
# Client updates come from the latest GitHub release of the public repo TalesUntold-updates.
ManifestUrl=https://github.com/Sant0shiq/TalesUntold-updates/releases/latest/download/manifest.json
# News and patch notes: edit news.json in the repo, no new release or launcher rebuild needed.
NewsUrl=https://raw.githubusercontent.com/Sant0shiq/TalesUntold-updates/main/news.json
GameExe=system\l2.exe
Title=TALES UNTOLD
# Background picture 1100x620 (any size is scaled to cover the window). Without it a dark gradient is drawn.
Background=launcher-bg.jpg
# Name|host|port;... — status cards in the top bar (game server port 7777).
Servers=Tales Untold|93.170.20.7|7777
# Buttons under the news: Caption|https://link;... (only http/https links open, empty links are hidden).
Links=GitHub|https://github.com/Sant0shiq/TalesUntold-updates
